<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — PlaytopiaLive</title>
<link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
<link rel="stylesheet" href="/static/css/official.css?v=4">
<link rel="stylesheet" href="/static/css/playtopia.css?v=8">
</head>
<body class="pt-body">
<div class="pt-login-wrap">
  <img src="/static/img/official-bg.webp" alt="" class="pt-login-bg">
  <div class="pt-login-box">
    <div class="pt-login-band">
      <div>
        <h1>Playtopia<span>Live</span></h1>
        <div style="font-family:'Pixel Operator',monospace; font-size:10px; letter-spacing:.14em; color:var(--pt-muted)">Live notifications</div>
      </div>
    </div>
    <div class="pt-goldrule"></div>
    <form id="loginForm" style="padding:20px 22px 22px; display:grid; gap:12px">
      <label for="username">Username</label>
      <input id="username" placeholder="Username" autocapitalize="none" spellcheck="false" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
      <button class="btn btn-gold" style="width:100%">Sign in</button>
      <p id="msg" role="status" aria-live="polite" class="msg msg-err"></p>
    </form>
  </div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const m = document.getElementById('msg');
  const form = e.currentTarget;
  const button = form.querySelector('button');
  if (button.disabled) return;
  button.disabled = true;
  button.textContent = 'Signing in...';
  m.textContent = '';
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 45000);
  try {
    const r = await fetch('/api/login', {signal: controller.signal, method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: form.querySelector('#username').value, password: form.querySelector('#password').value})});
    if (r.ok && (await r.json()).msg === 'Logged in') { location.assign('/'); return; }
    m.textContent = r.status === 401 ? 'Incorrect username or password.' :
      r.status === 429 ? 'Too many attempts. Wait five minutes before trying again.' : 'The server could not complete sign-in. Please try again.';
  } catch {
    m.textContent = controller.signal.aborted ? 'The server took too long. Please try again.' :
      'Could not complete sign-in. Check your connection and try again.';
  } finally {
    clearTimeout(timeout);
    button.textContent = 'Sign in';
    button.disabled = false;
  }
});
</script>
</body>
</html>
