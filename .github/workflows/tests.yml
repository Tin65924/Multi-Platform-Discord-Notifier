name: Tests
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: node --test worker/relay.test.mjs
      - run: python -m pytest tests -q
      - run: python -m tools.memory_soak --mode pooled --checks 10000 --concurrency 50
      - run: python -m tools.dashboard_load
